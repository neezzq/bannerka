<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Оплата заказа</title>
  <meta name="robots" content="noindex, nofollow">
  <meta name="theme-color" content="#f7f6fb">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="icons/apple-touch-icon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap">
  <link rel="stylesheet" href="app.css?v=5">
</head>
<body>

<header class="topbar">
  <div class="wrap topbar-in">
    <a class="brand" href="./">
      <span class="brand-mark" aria-hidden="true">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 3H7a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V8z"/><path d="M14 3v5h5"/><path d="M9 13h6M9 17h4"/></svg>
      </span>
      Доклады
    </a>
  </div>
</header>

<main class="wrap pay-main">
  <div class="card pay-card" id="payCard">
    <div class="loading">Загрузка…</div>
  </div>
  <p class="pay-secure">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg>
    Оплата проходит на защищённой странице ЮKassa: карта, СБП, SberPay, ЮMoney
  </p>
  <p class="pay-secure" id="paySupport"></p>
  <p class="pay-secure" id="payInn">Исполнитель: ИНН 300204777467</p>
</main>

<script src="config.js?v=5"></script>
<script src="common.js?v=5"></script>
<script>
(function () {
  'use strict';
  var A = window.App;
  var $ = function (id) { return document.getElementById(id); };
  var q = new URLSearchParams(location.search);
  var ref = { o: q.get('o') || '', t: q.get('t') || '' };
  var back = q.get('back') === '1';
  var EMAIL_KEY = 'zk_pay_email';
  var card = $('payCard');
  var info = null;

  A.loadConfig(function (cfg) {
    $('payInn').textContent = cfg.inn ? 'Исполнитель: ИНН ' + cfg.inn : '';
    $('payInn').hidden = !cfg.inn;
    var href = A.contactHref(cfg.support);
    $('paySupport').innerHTML = cfg.support
      ? 'Вопросы по оплате: ' + (href ? '<a href="' + A.esc(href) + '" target="_blank" rel="noopener">' + A.esc(cfg.support) + '</a>' : A.esc(cfg.support))
      : '';
  });

  function message(title, text, ok) {
    card.innerHTML =
      '<div class="pay-state ' + (ok ? 'ok' : '') + '">' +
        '<div class="modal-ico" aria-hidden="true">' + (ok
          ? '<svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>'
          : '<svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 8v5M12 16.5v.5"/></svg>') +
        '</div><h1>' + A.esc(title) + '</h1><p>' + text + '</p>' +
        '<a class="btn btn-ghost btn-block" href="./">На главную</a>' +
      '</div>';
  }

  function render() {
    var i = info;
    var head =
      '<div class="pay-head"><span class="order-no">Заказ №' + A.esc(i.id) + '</span>' +
      '<h1>' + A.esc(i.service) + '</h1>' +
      (i.topic ? '<p class="pay-topic">' + A.esc(i.topic) + '</p>' : '') + '</div>' +
      '<div class="modal-facts">' +
        '<div class="modal-fact"><span>Стоимость</span><b>' + A.money(i.price) + '</b></div>' +
        '<div class="modal-fact"><span>Оплачено</span><b>' + A.money(i.paid) + '</b></div>' +
      '</div>';

    if (i.status === 'cancelled') {
      card.innerHTML = head + '<div class="form-error">Заказ отменён — оплата не нужна.</div>';
      return;
    }
    if (i.rest <= 0) {
      card.innerHTML = head + '<div class="pay-done">✅ Заказ оплачен полностью. Спасибо!</div>';
      return;
    }
    if (!i.enabled) {
      card.innerHTML = head + '<div class="form-error">Онлайн-оплата сейчас недоступна. Напишите мне — договоримся.</div>';
      return;
    }

    var email = A.lsGet(EMAIL_KEY, '');
    card.innerHTML = head +
      (back && i.pending ? '<div class="pay-wait">⏳ Платёж ещё обрабатывается. Обновите страницу через минуту.</div>' : '') +
      (back && !i.pending && i.paid > 0 ? '<div class="pay-done">✅ Оплата получена. Спасибо!</div>' : '') +
      (i.receipt
        ? '<div class="field"><label for="payEmail">Email для чека <span class="req">*</span></label>' +
          '<input id="payEmail" type="email" inputmode="email" autocomplete="email" maxlength="100" placeholder="name@mail.ru" value="' + A.esc(email) + '">' +
          '<div class="err">Укажите email — на него придёт чек</div></div>'
        : '') +
      '<div class="pay-buttons">' +
        '<button type="button" class="btn btn-primary btn-lg btn-block" data-kind="full">' + (i.paid > 0 ? 'Доплатить' : 'Оплатить') + ' ' + A.money(i.rest) + '</button>' +
      '</div>' +
      '<div class="form-error" id="payError" hidden></div>';
  }

  card.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-kind]');
    if (!btn) return;
    var emailEl = $('payEmail');
    var email = emailEl ? emailEl.value.trim() : '';
    if (emailEl) {
      var ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
      emailEl.closest('.field').classList.toggle('invalid', !ok);
      if (!ok) { emailEl.focus(); return; }
      A.lsSet(EMAIL_KEY, email);
    }
    var label = btn.textContent;
    card.querySelectorAll('[data-kind]').forEach(function (b) { b.disabled = true; });
    btn.textContent = 'Переходим к оплате…';
    $('payError').hidden = true;
    A.api('pay', Object.assign({ email: email }, ref)).then(function (res) {
      location.href = res.url;
    }).catch(function (err) {
      $('payError').textContent = err.message;
      $('payError').hidden = false;
      card.querySelectorAll('[data-kind]').forEach(function (b) { b.disabled = false; });
      btn.textContent = label;
    });
  });

  if (!ref.o || !ref.t) {
    message('Ссылка неполная', 'Откройте ссылку на оплату целиком — так, как я её прислал.');
    return;
  }

  A.api(back ? 'payCheck' : 'payInfo', ref).then(function (res) {
    info = res.info;
    if (back && !info.pending && info.rest <= 0) {
      message('Оплата прошла', 'Заказ №' + A.esc(info.id) + ' оплачен полностью. Спасибо! Я напишу вам, когда работа будет готова.', true);
      return;
    }
    render();
  }).catch(function (err) {
    message('Не получилось открыть оплату', A.esc(err.message));
  });
})();
</script>
</body>
</html>
